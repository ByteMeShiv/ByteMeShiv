{% extends "base.html" %}

{% block content %}
<div class="flex flex-col lg:flex-row items-center justify-between min-h-[70vh] gap-12 max-w-6xl mx-auto">

    <div class="flex-1 w-full">
        <div class="text-theme-600 text-[10px] font-bold uppercase tracking-[0.4em] mb-4 border border-theme-600/30 px-3 py-1 inline-block bg-theme-600/5">
            SYS_ADMIN: IDENTIFIED
        </div>

        <h1 class="text-6xl md:text-8xl font-black text-white mb-6 leading-none tracking-tighter">
            ARCHITECT.<br>
            ENGINEER.<br>
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-theme-600 to-neutral-700">SCALE.</span>
        </h1>

        <p class="text-lg text-neutral-400 max-w-xl mb-10 border-l-[3px] border-theme-600 pl-6 bg-gradient-to-r from-theme-600/10 to-transparent py-2">
            Protocol initialized by <span class="text-white font-bold cursor-crosshair hover:text-theme-500 transition">{{ name }}</span>.
            Specializing in distributed systems, asynchronous workflows, and API architectures.
        </p>

        <div class="flex gap-4">
            <a href="/projects" class="px-8 py-4 bg-theme-600 text-white text-xs font-bold uppercase tracking-[0.2em] hover:bg-theme-500 transition-all shadow-[0_0_20px_var(--theme-glow)]">
                Execute_Start()
            </a>
            <a href="https://github.com/bytemeshiv" target="_blank" class="px-8 py-4 border border-neutral-800 text-neutral-400 hover:border-theme-600 hover:text-white text-xs font-bold uppercase tracking-[0.2em] transition-all bg-neutral-950">
                View_Source
            </a>
        </div>
    </div>

    <div class="flex-1 w-full max-w-lg">
        <div class="border border-neutral-800 bg-black rounded-sm overflow-hidden shadow-[0_0_30px_rgba(0,0,0,0.8)] relative">
            <div class="bg-neutral-900 border-b border-neutral-800 px-4 py-2 flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-green-500/50"></div>
                <div class="ml-4 text-[10px] text-neutral-500 font-mono tracking-widest">root@bytemeshiv:~</div>
            </div>
            <div class="p-6 h-[300px] overflow-y-auto text-sm text-neutral-300 space-y-2 font-mono" id="terminal-output">
                </div>
        </div>
    </div>

</div>

<script>
    // Terminal Typing Effect Script
    function initTerminal() {
        const output = document.getElementById('terminal-output');
        if (!output) return;
        output.innerHTML = '';

        const commands = [
            "Initializing system parameters...",
            "[OK] Kernel loaded",
            "Loading core modules:",
            " > Python 3.11 ............ [ACTIVE]",
            " > FastAPI & Django ....... [ACTIVE]",
            " > PostgreSQL & MongoDB ... [ACTIVE]",
            "Establishing cloud uplinks:",
            " > AWS S3 Pipelines ....... [SYNCED]",
            " > Docker Containers ...... [RUNNING]",
            " > Redis Message Broker ... [CONNECTED]",
            "Integrating AI APIs:",
            " > LangChain Framework .... [READY]",
            " > Pinecone Vector DB ..... [READY]",
            "System boot sequence complete. Awaiting input_"
        ];

        let lineIndex = 0;

        function typeLine() {
            if (lineIndex < commands.length) {
                const p = document.createElement('div');
                let text = commands[lineIndex];

                // Color formatting
                if(text.includes('[ACTIVE]') || text.includes('[SYNCED]') || text.includes('[RUNNING]') || text.includes('[READY]')) {
                     text = text.replace(/\[.*?\]/, match => `<span class="text-theme-500">${match}</span>`);
                }
                if(text.includes('>')) {
                    text = text.replace('>', `<span class="text-neutral-600">></span>`);
                }

                p.innerHTML = text;
                p.style.opacity = '0';
                p.style.animation = 'fadeIn 0.1s forwards';
                output.appendChild(p);
                output.scrollTop = output.scrollHeight;

                lineIndex++;
                let delay = text.includes('...') ? 400 : 150;
                if(lineIndex === commands.length) delay = 800;

                setTimeout(typeLine, delay);
            }
        }

        setTimeout(typeLine, 500);
    }

    // Add simple fade animation CSS dynamically
    if(!document.getElementById('terminal-styles')) {
        const style = document.createElement('style');
        style.id = 'terminal-styles';
        style.innerHTML = `@keyframes fadeIn { to { opacity: 1; } }`;
        document.head.appendChild(style);
    }

    initTerminal();
</script>
{% endblock %}
